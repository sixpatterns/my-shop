name: build

on: [push]

env:
  ADMIN_HOST: admin.localhost
  DATABASE_URL: postgres://postgres@localhost/backend_test
  FERRUM_NODE_MOVING_WAIT: 0.1
  PARALLEL_WORKERS: 1

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        image: postgres:alpine
        ports:
          - 5432:5432

    steps:
      # Install
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: 3.4.5
      - uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version: 24.14.0

      - run: yarn install --frozen-lockfile

      # Codegen
      - name: Generate schema.graphql
        run: |
          bundle exec rails runner 'require "graphql/rake_task"; GraphQL::RakeTask.new(schema_name: "BackendSchema", idl_outfile: "schema.graphql"); Rake::Task["graphql:schema:idl"].invoke'
      - name: Validate schema.graphql
        run: git diff --exit-code schema.graphql
      - run: yarn codegen

      # Lint
      - run: bundle exec rubocop
      - run: yarn lint
      - run: yarn format --check

      - run: yarn build

      # Tests
      - run: bundle exec rails db:create
        env:
          RAILS_ENV: test
      - run: bundle exec rails test
      - run: bundle exec rails test:system
